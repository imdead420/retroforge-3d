<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RetroForge 3D — Print on Demand</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.2.0"
  }
}
</script>
<style>
  body { margin: 0; }
  @keyframes blink { 50% { opacity: 0; } }
  input[type=range] { height: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useRef } from "react";
import { createRoot } from "react-dom/client";
import { Upload, ShoppingCart, Cpu, Box, Truck, FileUp, X, Plus, Minus, Phone, Mail, MapPin, Layers, Check, Terminal, CreditCard, Smartphone, Sliders, Gauge } from "lucide-react";

// ---- RETRO PALETTE ----
const C = {
  cream: "#f3e9d2", paper: "#efe2c4", ink: "#1c1726",
  teal: "#1f8a82", tealDk: "#155f59", orange: "#e8623b",
  mustard: "#e8b13a", pink: "#d6275c", purple: "#3a2d52",
};

// ========================================================
//  PRICING  —  EDIT THESE NUMBERS TO TUNE YOUR BUSINESS
// ========================================================
const PRICING = {
  cost:  { PLA: 3, PETG: 5, TPU: 7 },
  markup: 2.5,
  setup: { PLA: 49, PETG: 59, TPU: 79 },
  gst: 0.18,
  supportSurcharge: 0.12,
};

const PRECISION = [
  { id: "draft",    label: "Draft",      layer: "0.28mm", mult: 0.85, note: "Fast & economical. Layers visible." },
  { id: "standard", label: "Standard",   layer: "0.20mm", mult: 1.0,  note: "Balanced detail & speed." },
  { id: "fine",     label: "Fine",       layer: "0.12mm", mult: 1.3,  note: "Smooth surfaces. Slower print." },
  { id: "ultra",    label: "Ultra Fine", layer: "0.08mm", mult: 1.7,  note: "Maximum detail. Slowest." },
];

const sellRate = (mat) => Math.round(PRICING.cost[mat] * PRICING.markup);
const printPrice = (grams, mat, opts = {}) => {
  const { infillFactor = 1, qualityMult = 1, supports = false, qty = 1 } = opts;
  const sup = supports ? 1 + PRICING.supportSurcharge : 1;
  return Math.round((grams * PRICING.cost[mat] * PRICING.markup * infillFactor * qualityMult * sup + PRICING.setup[mat]) * qty);
};

const ZONES = [
  { id: "ncr",    label: "Delhi NCR (Local)",    base: 40 },
  { id: "north",  label: "North / West India",   base: 75 },
  { id: "south",  label: "South / East India",   base: 95 },
  { id: "remote", label: "NE / Hills / Islands",  base: 149 },
];
const shipCost = (zoneBase, grams) => zoneBase + Math.max(0, Math.ceil((grams - 250) / 250)) * 30;

const MATERIALS = {
  PLA:  { blurb: "Everyday prints. Crisp detail, easy & affordable.", colors: ["Cream", "Black", "Red", "Teal", "Gold", "White"] },
  PETG: { blurb: "Tough & heat-resistant. Outdoor & functional parts.", colors: ["Black", "Clear", "Orange", "Blue", "White"] },
  TPU:  { blurb: "Flexible & grippy. Phone cases, gaskets, flexi toys.", colors: ["Black", "Red", "Yellow", "Clear"] },
};

const PRODUCTS = [
  { id: 1, name: "Articulated Flexi Dragon", tag: "BESTSELLER", grams: 55, mat: "PLA",  emoji: "\u{1F409}", desc: "Print-in-place. Every scale moves." },
  { id: 2, name: "Capybara Desk Buddy",      tag: "VIRAL",      grams: 22, mat: "PLA",  emoji: "\u{1F9AB}", desc: "The internet's favourite chill mascot." },
  { id: 3, name: "Self-Watering Planter",    tag: "DECOR",      grams: 75, mat: "PETG", emoji: "\u{1FAB4}", desc: "Faceted pot + water reservoir." },
  { id: 4, name: "Gridfinity Bin Set (8)",   tag: "STORAGE",    grams: 90, mat: "PLA",  emoji: "\u{1F4E6}", desc: "Modular drawer bins. MIT-licensed." },
  { id: 5, name: "Adjustable Phone Stand",   tag: "DESK",       grams: 28, mat: "PLA",  emoji: "\u{1F4F1}", desc: "Foldable, multi-angle, fits all phones." },
  { id: 6, name: "Headphone Stand",          tag: "DESK",       grams: 65, mat: "PLA",  emoji: "\u{1F3A7}", desc: "Clean-lined desktop headset perch." },
  { id: 7, name: "Cable Clip Set (5)",       tag: "DESK",       grams: 18, mat: "PETG", emoji: "\u{1F50C}", desc: "Stick-on desk cable management." },
  { id: 8, name: "Flexi Octopus Fidget",     tag: "FIDGET",     grams: 30, mat: "TPU",  emoji: "\u{1F419}", desc: "Soft, squishy, satisfying flexi toy." },
  { id: 9, name: "Ganesha Desk Idol",        tag: "FESTIVE",    grams: 45, mat: "PLA",  emoji: "\u{1F549}\uFE0F", desc: "Detailed matte-finish murti." },
  { id: 10, name: "Low-Poly Pen Pot",        tag: "DESK",       grams: 40, mat: "PLA",  emoji: "\u270F\uFE0F", desc: "Geometric desktop organiser." },
];

const WHATSAPP = "919737760333";
const EMAIL = "sheersh.sharma1@gmail.com";
const PHONE_DISPLAY = "+91 97377 60333";

function Scanlines() {
  return <div className="pointer-events-none fixed inset-0 z-50" style={{ background: "repeating-linear-gradient(0deg, rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px, transparent 1px, transparent 3px)" }} />;
}
function Panel({ children, color = C.cream, className = "", style = {} }) {
  return <div className={className} style={{ background: color, border: `3px solid ${C.ink}`, boxShadow: `6px 6px 0 ${C.ink}`, ...style }}>{children}</div>;
}
function Btn({ children, onClick, color = C.orange, className = "", style = {} }) {
  return (
    <button onClick={onClick} className={`font-mono font-bold uppercase tracking-wide ${className}`}
      style={{ background: color, color: C.cream, border: `3px solid ${C.ink}`, boxShadow: `4px 4px 0 ${C.ink}`, padding: "10px 18px", ...style }}
      onMouseDown={e => { e.currentTarget.style.transform = "translate(2px,2px)"; e.currentTarget.style.boxShadow = `2px 2px 0 ${C.ink}`; }}
      onMouseUp={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = `4px 4px 0 ${C.ink}`; }}
      onMouseLeave={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = `4px 4px 0 ${C.ink}`; }}>
      {children}
    </button>
  );
}
function Tag({ children, color }) {
  return <span className="font-mono text-xs font-bold px-2 py-1" style={{ background: color, color: C.cream, border: `2px solid ${C.ink}` }}>{children}</span>;
}
function Row({ label, val, bold }) {
  return <div className="flex justify-between font-mono text-sm" style={{ fontWeight: bold ? 800 : 400 }}><span>{label}</span><span>{val}</span></div>;
}

function App() {
  const [tab, setTab] = useState("home");
  const [cart, setCart] = useState([]);
  const fileRef = useRef(null);

  const [files, setFiles] = useState([]);
  const [mat, setMat] = useState("PLA");
  const [color, setColor] = useState("Cream");
  const [prec, setPrec] = useState("standard");
  const [supports, setSupports] = useState(false);
  const [infill, setInfill] = useState(20);
  const [qty, setQty] = useState(1);
  const [grams, setGrams] = useState(30);
  const [notes, setNotes] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [zone, setZone] = useState("ncr");
  const [drag, setDrag] = useState(false);
  const [cZone, setCZone] = useState("ncr");

  const m = MATERIALS[mat];
  const precObj = PRECISION.find(p => p.id === prec);
  const zoneObj = ZONES.find(z => z.id === zone);
  const infillFactor = 0.7 + infill / 100 * 0.6;
  const qSubtotal = printPrice(grams, mat, { infillFactor, qualityMult: precObj.mult, supports, qty });
  const qShip = shipCost(zoneObj.base, grams * qty);
  const qGst = Math.round((qSubtotal + qShip) * PRICING.gst);
  const qTotal = qSubtotal + qShip + qGst;

  const addFiles = (fl) => setFiles(prev => [...prev, ...Array.from(fl).map(f => f.name)]);
  const onDrop = (e) => { e.preventDefault(); setDrag(false); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); };

  const submitQuote = () => {
    const msg = `*RetroForge 3D \u2014 Print Quote*%0A%0A` +
      `Files: ${files.length ? files.join(", ") : "(will send in chat)"}%0A` +
      `Material: ${mat} (${color})%0APrecision: ${precObj.label} (${precObj.layer})%0AInfill: ${infill}%25%0A` +
      `Supports: ${supports ? "Yes" : "No"}%0AQty: ${qty}%0AEst weight: ${grams}g%0A` +
      `Deliver to: ${zoneObj.label}%0A%0ASubtotal: \u20B9${qSubtotal}%0AShipping: \u20B9${qShip}%0AGST 18%25: \u20B9${qGst}%0A*Total: \u20B9${qTotal}*%0A%0A` +
      `Pay by: UPI / Credit Card%0ANotes: ${notes || "-"}%0A%0AName: ${name}%0APhone: ${phone}`;
    window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, "_blank");
  };

  const inCart = (id) => cart.find(c => c.id === id);
  const addCart = (p) => setCart(prev => inCart(p.id) ? prev.map(c => c.id === p.id ? { ...c, q: c.q + 1 } : c) : [...prev, { ...p, q: 1 }]);
  const decCart = (id) => setCart(prev => prev.flatMap(c => c.id === id ? (c.q > 1 ? [{ ...c, q: c.q - 1 }] : []) : [c]));

  const cartCount = cart.reduce((s, c) => s + c.q, 0);
  const cartSubtotal = cart.reduce((s, c) => s + printPrice(c.grams, c.mat) * c.q, 0);
  const cartGrams = cart.reduce((s, c) => s + c.grams * c.q, 0);
  const cZoneObj = ZONES.find(z => z.id === cZone);
  const cShip = cart.length ? shipCost(cZoneObj.base, cartGrams) : 0;
  const cGst = Math.round((cartSubtotal + cShip) * PRICING.gst);
  const cTotal = cartSubtotal + cShip + cGst;

  const checkout = () => {
    const lines = cart.map(c => `${c.q}x ${c.name} (${c.mat}) - \u20B9${printPrice(c.grams, c.mat) * c.q}`).join("%0A");
    const msg = `*RetroForge 3D \u2014 Store Order*%0A%0A${lines}%0A%0ASubtotal: \u20B9${cartSubtotal}%0AShipping (${cZoneObj.label}): \u20B9${cShip}%0AGST 18%25: \u20B9${cGst}%0A*Total: \u20B9${cTotal}*%0A%0APay by: UPI / Credit Card%0A%0AName:%0APhone:%0AFull address:`;
    window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, "_blank");
  };

  const NAV = [["home", "Home"], ["upload", "Upload & Print"], ["store", "Store"], ["how", "How It Works"]];
  const ZoneSelect = ({ value, onChange }) => (
    <select value={value} onChange={e => onChange(e.target.value)} className="w-full font-mono p-3 text-sm" style={{ background: C.cream, border: `3px solid ${C.ink}` }}>
      {ZONES.map(z => <option key={z.id} value={z.id}>{z.label} \u2014 from \u20B9{z.base}</option>)}
    </select>
  );

  return (
    <div className="min-h-screen w-full" style={{ background: C.cream, color: C.ink, fontFamily: "ui-monospace, monospace" }}>
      <Scanlines />

      <div className="sticky top-0 z-40" style={{ background: C.ink }}>
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <button onClick={() => setTab("home")} className="flex items-center gap-2">
            <div style={{ background: C.orange, border: `2px solid ${C.cream}`, padding: 4 }}><Box size={20} color={C.cream} /></div>
            <span className="font-mono font-bold text-lg" style={{ color: C.cream }}>RETRO<span style={{ color: C.mustard }}>FORGE</span><span style={{ color: C.teal }}>_3D</span></span>
          </button>
          <div className="flex items-center gap-1 flex-wrap">
            {NAV.map(([k, label]) => (
              <button key={k} onClick={() => setTab(k)} className="font-mono text-xs font-bold uppercase px-3 py-2"
                style={{ color: tab === k ? C.ink : C.cream, background: tab === k ? C.mustard : "transparent" }}>{label}</button>
            ))}
            <button onClick={() => setTab("store")} className="relative px-3 py-2" style={{ color: C.cream }}>
              <ShoppingCart size={16} />
              {cartCount > 0 && <span className="absolute -top-1 -right-1 text-xs px-1" style={{ background: C.pink, color: C.cream, borderRadius: 2 }}>{cartCount}</span>}
            </button>
          </div>
        </div>
      </div>

      {tab === "home" && (
        <div>
          <div style={{ background: C.purple, borderBottom: `4px solid ${C.ink}` }}>
            <div className="max-w-6xl mx-auto px-4 py-14 grid md:grid-cols-2 gap-8 items-center">
              <div>
                <div className="inline-flex items-center gap-2 mb-4 font-mono text-xs" style={{ color: C.mustard }}>
                  <Terminal size={14} /> <span>&gt; india's print-on-demand bureau<span style={{ animation: "blink 1s step-end infinite" }}>_</span></span>
                </div>
                <h1 className="font-mono font-black leading-none mb-4" style={{ fontSize: "clamp(2.2rem,6vw,4rem)", color: C.cream, textShadow: `4px 4px 0 ${C.orange}` }}>
                  UPLOAD.<br />WE PRINT.<br /><span style={{ color: C.mustard }}>YOU BUILD.</span>
                </h1>
                <p className="font-mono mb-6 max-w-md" style={{ color: C.paper }}>
                  Drop any 3D file \u2014 STL, OBJ, 3MF, STEP \u2014 pick your material & precision, get a live quote. Like a PCB house, but for plastic. Shipped across India.
                </p>
                <div className="flex gap-3 flex-wrap">
                  <Btn onClick={() => setTab("upload")} color={C.orange}><span className="flex items-center gap-2"><FileUp size={16} /> Get a Quote</span></Btn>
                  <Btn onClick={() => setTab("store")} color={C.teal}><span className="flex items-center gap-2"><ShoppingCart size={16} /> Browse Store</span></Btn>
                </div>
              </div>
              <div className="flex justify-center">
                <Panel color={C.cream} className="p-6 w-full max-w-sm" style={{ boxShadow: `10px 10px 0 ${C.ink}` }}>
                  <div className="font-mono text-xs mb-3" style={{ color: C.tealDk }}>LIVE PRINT QUEUE</div>
                  {[["dragon_v2.stl", "PLA", "printing", C.orange], ["bracket.step", "PETG", "queued", C.mustard], ["case.3mf", "TPU", "done", C.teal]].map(([f, mt, st, col], i) => (
                    <div key={i} className="flex items-center justify-between py-2" style={{ borderBottom: i < 2 ? `2px dashed ${C.ink}` : "none" }}>
                      <span className="font-mono text-sm font-bold">{f}</span>
                      <span className="flex items-center gap-2"><Tag color={C.purple}>{mt}</Tag>
                        <span className="font-mono text-xs px-2 py-1" style={{ background: col, color: C.ink, border: `2px solid ${C.ink}` }}>{st}</span></span>
                    </div>
                  ))}
                </Panel>
              </div>
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-12">
            <h2 className="font-mono font-black text-2xl mb-1" style={{ textShadow: `2px 2px 0 ${C.mustard}` }}>THREE MATERIALS</h2>
            <p className="font-mono text-sm mb-6" style={{ color: C.tealDk }}>Printed on our Bambu Lab A1 \u2014 PLA, PETG & TPU available now.</p>
            <div className="grid md:grid-cols-3 gap-5">
              {Object.entries(MATERIALS).map(([k, v]) => (
                <Panel key={k} color={C.paper} className="p-5">
                  <div className="flex items-center justify-between mb-3"><span className="font-mono font-black text-2xl">{k}</span><Layers size={24} color={C.orange} /></div>
                  <p className="font-mono text-sm mb-4" style={{ minHeight: 48 }}>{v.blurb}</p>
                  <div className="font-mono text-xs" style={{ color: C.tealDk }}>FROM</div>
                  <div className="font-mono font-black text-xl">\u20B9{sellRate(k)}<span className="text-sm font-normal">/gram</span></div>
                  <div className="font-mono text-xs mt-1">+ \u20B9{PRICING.setup[k]} setup</div>
                </Panel>
              ))}
            </div>
          </div>

          <div style={{ background: C.teal, borderTop: `4px solid ${C.ink}`, borderBottom: `4px solid ${C.ink}` }}>
            <div className="max-w-6xl mx-auto px-4 py-8 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
              {[["220\u00D7220\u00D7250", "BUILD VOLUME mm"], ["0.08mm", "FINEST LAYER"], ["48hr", "AVG TURNAROUND"], ["UPI + CARD", "PAYMENTS"]].map(([n, l], i) => (
                <div key={i}><div className="font-mono font-black text-2xl" style={{ color: C.cream }}>{n}</div><div className="font-mono text-xs" style={{ color: C.ink }}>{l}</div></div>
              ))}
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-14 text-center">
            <h2 className="font-mono font-black text-3xl mb-4">GOT A FILE? <span style={{ color: C.orange }}>LET'S PRINT IT.</span></h2>
            <Btn onClick={() => setTab("upload")} color={C.pink} style={{ fontSize: 16, padding: "14px 28px" }}><span className="flex items-center gap-2"><Upload size={18} /> Start Your Order</span></Btn>
          </div>
        </div>
      )}

      {tab === "upload" && (
        <div className="max-w-5xl mx-auto px-4 py-10">
          <h1 className="font-mono font-black text-3xl mb-1" style={{ textShadow: `3px 3px 0 ${C.orange}` }}>UPLOAD &amp; PRINT</h1>
          <p className="font-mono text-sm mb-8" style={{ color: C.tealDk }}>Any format welcome. Dial in your settings \u2014 exact price confirmed after we check your file.</p>
          <div className="grid md:grid-cols-2 gap-6">
            <div className="space-y-6">
              <div onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={onDrop} onClick={() => fileRef.current?.click()}
                className="cursor-pointer p-8 text-center" style={{ background: drag ? C.mustard : C.paper, border: `3px dashed ${C.ink}` }}>
                <input ref={fileRef} type="file" multiple className="hidden" onChange={e => addFiles(e.target.files)} />
                <Upload size={40} color={C.orange} className="mx-auto mb-3" />
                <div className="font-mono font-bold">DROP FILES HERE</div>
                <div className="font-mono text-xs mt-1" style={{ color: C.tealDk }}>STL \u00B7 OBJ \u00B7 3MF \u00B7 STEP \u00B7 any format</div>
              </div>
              {files.length > 0 && (
                <Panel color={C.cream} className="p-3">
                  {files.map((f, i) => (
                    <div key={i} className="flex items-center justify-between py-1">
                      <span className="font-mono text-sm truncate flex items-center gap-2"><FileUp size={14} color={C.teal} /> {f}</span>
                      <button onClick={() => setFiles(files.filter((_, j) => j !== i))}><X size={16} color={C.pink} /></button>
                    </div>
                  ))}
                </Panel>
              )}
              <div>
                <div className="font-mono font-bold text-sm mb-2 uppercase">Material</div>
                <div className="grid grid-cols-3 gap-2">
                  {Object.keys(MATERIALS).map(k => (
                    <button key={k} onClick={() => { setMat(k); setColor(MATERIALS[k].colors[0]); }} className="font-mono font-bold py-3"
                      style={{ background: mat === k ? C.teal : C.paper, color: mat === k ? C.cream : C.ink, border: `3px solid ${C.ink}`, boxShadow: mat === k ? `3px 3px 0 ${C.ink}` : "none" }}>{k}</button>
                  ))}
                </div>
                <p className="font-mono text-xs mt-2" style={{ color: C.tealDk }}>{m.blurb}</p>
              </div>
              <div>
                <div className="font-mono font-bold text-sm mb-2 uppercase">Colour</div>
                <div className="flex gap-2 flex-wrap">
                  {m.colors.map(c => (
                    <button key={c} onClick={() => setColor(c)} className="font-mono text-xs font-bold px-3 py-2"
                      style={{ background: color === c ? C.orange : C.paper, color: color === c ? C.cream : C.ink, border: `2px solid ${C.ink}` }}>{c}</button>
                  ))}
                </div>
              </div>
            </div>

            <div className="space-y-5">
              <Panel color={C.paper} className="p-5">
                <div className="flex items-center justify-between mb-1">
                  <div className="font-mono font-bold text-sm uppercase flex items-center gap-2"><Gauge size={16} color={C.orange} /> Precision</div>
                  <Tag color={C.purple}>BAMBU A1 \u00B7 0.4mm</Tag>
                </div>
                <p className="font-mono text-xs mb-3" style={{ color: C.tealDk }}>Finer layers = smoother finish, longer print, higher price.</p>
                <div className="grid grid-cols-2 gap-2">
                  {PRECISION.map(p => (
                    <button key={p.id} onClick={() => setPrec(p.id)} className="text-left p-3"
                      style={{ background: prec === p.id ? C.teal : C.cream, color: prec === p.id ? C.cream : C.ink, border: `3px solid ${C.ink}`, boxShadow: prec === p.id ? `3px 3px 0 ${C.ink}` : "none" }}>
                      <div className="font-mono font-bold text-sm">{p.label}</div>
                      <div className="font-mono text-xs">{p.layer}</div>
                    </button>
                  ))}
                </div>
                <p className="font-mono text-xs mt-2" style={{ color: C.tealDk }}>{precObj.note}</p>
              </Panel>

              <Panel color={C.paper} className="p-5 space-y-5">
                <div className="font-mono font-bold text-sm uppercase flex items-center gap-2"><Sliders size={16} color={C.orange} /> Settings</div>
                <div>
                  <div className="flex justify-between font-mono font-bold text-sm uppercase"><span>Infill</span><span>{infill}%</span></div>
                  <input type="range" min={5} max={100} step={5} value={infill} onChange={e => setInfill(+e.target.value)} className="w-full" style={{ accentColor: C.orange }} />
                  <div className="font-mono text-xs" style={{ color: C.tealDk }}>Low = light & cheap \u00B7 High = strong & solid.</div>
                </div>
                <div>
                  <div className="font-mono font-bold text-sm uppercase mb-2">Supports</div>
                  <div className="grid grid-cols-2 gap-2">
                    {[["No supports", false], ["Auto (+12%)", true]].map(([lbl, val]) => (
                      <button key={lbl} onClick={() => setSupports(val)} className="font-mono text-xs font-bold py-2"
                        style={{ background: supports === val ? C.orange : C.cream, color: supports === val ? C.cream : C.ink, border: `3px solid ${C.ink}` }}>{lbl}</button>
                    ))}
                  </div>
                  <div className="font-mono text-xs mt-1" style={{ color: C.tealDk }}>Needed for steep overhangs. Unsure? Leave us a note.</div>
                </div>
                <div>
                  <div className="flex justify-between font-mono font-bold text-sm uppercase"><span>Est. Weight</span><span>{grams}g</span></div>
                  <input type="range" min={5} max={500} step={5} value={grams} onChange={e => setGrams(+e.target.value)} className="w-full" style={{ accentColor: C.orange }} />
                  <div className="font-mono text-xs" style={{ color: C.tealDk }}>Not sure? Leave it \u2014 we'll weigh from your file.</div>
                </div>
                <div>
                  <div className="font-mono font-bold text-sm uppercase mb-2">Quantity</div>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setQty(Math.max(1, qty - 1))} style={{ background: C.ink }} className="p-2"><Minus size={16} color={C.cream} /></button>
                    <span className="font-mono font-black text-xl w-8 text-center">{qty}</span>
                    <button onClick={() => setQty(qty + 1)} style={{ background: C.ink }} className="p-2"><Plus size={16} color={C.cream} /></button>
                  </div>
                </div>
                <div>
                  <div className="font-mono font-bold text-sm uppercase mb-2">Deliver To</div>
                  <ZoneSelect value={zone} onChange={setZone} />
                </div>
              </Panel>

              <Panel color={C.ink} className="p-5">
                <div className="font-mono text-xs mb-2" style={{ color: C.mustard }}>BALLPARK ESTIMATE</div>
                <div style={{ color: C.cream }} className="space-y-1">
                  <Row label={`${qty}\u00D7 ${mat} \u00B7 ${precObj.label}${supports ? " \u00B7 supports" : ""}`} val={`\u20B9${qSubtotal}`} />
                  <Row label={`Shipping \u00B7 ${zoneObj.label}`} val={`\u20B9${qShip}`} />
                  <Row label="GST 18%" val={`\u20B9${qGst}`} />
                  <div style={{ borderTop: `2px dashed ${C.paper}`, margin: "6px 0" }} />
                  <Row label="TOTAL" val={`\u20B9${qTotal}`} bold />
                </div>
              </Panel>

              <div className="flex items-center gap-3 font-mono text-xs" style={{ color: C.tealDk }}>
                <span className="flex items-center gap-1"><Smartphone size={14} /> UPI</span>
                <span className="flex items-center gap-1"><CreditCard size={14} /> Credit Card</span>
              </div>

              <div className="space-y-2">
                <input value={name} onChange={e => setName(e.target.value)} placeholder="Your name" className="w-full font-mono p-3" style={{ background: C.cream, border: `3px solid ${C.ink}` }} />
                <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="Phone / WhatsApp" className="w-full font-mono p-3" style={{ background: C.cream, border: `3px solid ${C.ink}` }} />
                <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Notes \u2014 finish, deadline, etc." rows={2} className="w-full font-mono p-3" style={{ background: C.cream, border: `3px solid ${C.ink}` }} />
              </div>
              <Btn onClick={submitQuote} color={C.pink} className="w-full" style={{ fontSize: 15, padding: "14px" }}>
                <span className="flex items-center justify-center gap-2"><Phone size={16} /> Send Quote on WhatsApp</span>
              </Btn>
              <p className="font-mono text-xs text-center" style={{ color: C.tealDk }}>Opens WhatsApp with everything pre-filled. Attach files in chat.</p>
            </div>
          </div>
        </div>
      )}

      {tab === "store" && (
        <div className="max-w-6xl mx-auto px-4 py-10">
          <div className="mb-8">
            <h1 className="font-mono font-black text-3xl" style={{ textShadow: `3px 3px 0 ${C.teal}` }}>THE STORE</h1>
            <p className="font-mono text-sm" style={{ color: C.tealDk }}>Popular models at Standard 0.20mm. Want finer? Use Upload & Print. Prices ex-shipping.</p>
          </div>

          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {PRODUCTS.map(p => (
              <Panel key={p.id} color={C.paper} className="flex flex-col">
                <div className="flex items-center justify-center text-6xl" style={{ height: 120, background: C.cream, borderBottom: `3px solid ${C.ink}` }}>{p.emoji}</div>
                <div className="p-4 flex flex-col flex-1">
                  <div className="flex items-center justify-between mb-2"><Tag color={C.purple}>{p.tag}</Tag><Tag color={C.teal}>{p.mat}</Tag></div>
                  <div className="font-mono font-bold">{p.name}</div>
                  <div className="font-mono text-xs mb-3 flex-1" style={{ color: C.tealDk }}>{p.desc}</div>
                  <div className="flex items-center justify-between">
                    <span className="font-mono font-black text-lg">\u20B9{printPrice(p.grams, p.mat)}</span>
                    {inCart(p.id) ? (
                      <div className="flex items-center gap-2">
                        <button onClick={() => decCart(p.id)} style={{ background: C.ink }} className="p-1"><Minus size={14} color={C.cream} /></button>
                        <span className="font-mono font-bold">{inCart(p.id).q}</span>
                        <button onClick={() => addCart(p)} style={{ background: C.ink }} className="p-1"><Plus size={14} color={C.cream} /></button>
                      </div>
                    ) : (<Btn onClick={() => addCart(p)} color={C.orange} style={{ padding: "6px 12px", fontSize: 11 }}>Add</Btn>)}
                  </div>
                </div>
              </Panel>
            ))}
          </div>

          {cartCount > 0 && (
            <Panel color={C.cream} className="p-5 mt-8 max-w-md ml-auto">
              <div className="font-mono font-bold text-sm uppercase mb-3">Your Cart ({cartCount})</div>
              {cart.map(c => (
                <div key={c.id} className="flex justify-between font-mono text-sm py-1">
                  <span>{c.q}\u00D7 {c.name}</span><span>\u20B9{printPrice(c.grams, c.mat) * c.q}</span>
                </div>
              ))}
              <div className="mt-3 mb-3"><div className="font-mono text-xs uppercase mb-1" style={{ color: C.tealDk }}>Deliver to</div><ZoneSelect value={cZone} onChange={setCZone} /></div>
              <div style={{ borderTop: `2px dashed ${C.ink}`, paddingTop: 8 }} className="space-y-1">
                <Row label="Subtotal" val={`\u20B9${cartSubtotal}`} />
                <Row label="Shipping" val={`\u20B9${cShip}`} />
                <Row label="GST 18%" val={`\u20B9${cGst}`} />
                <Row label="TOTAL" val={`\u20B9${cTotal}`} bold />
              </div>
              <div className="flex items-center gap-3 font-mono text-xs my-3" style={{ color: C.tealDk }}>
                <span className="flex items-center gap-1"><Smartphone size={14} /> UPI</span>
                <span className="flex items-center gap-1"><CreditCard size={14} /> Credit Card</span>
              </div>
              <Btn onClick={checkout} color={C.pink} className="w-full" style={{ padding: "12px" }}>Checkout on WhatsApp</Btn>
            </Panel>
          )}

          <p className="font-mono text-xs mt-8 text-center" style={{ color: C.tealDk }}>
            Want a colour/material not listed? Use <button onClick={() => setTab("upload")} style={{ color: C.orange, textDecoration: "underline" }}>Upload &amp; Print</button> instead.
          </p>
        </div>
      )}

      {tab === "how" && (
        <div className="max-w-5xl mx-auto px-4 py-10">
          <h1 className="font-mono font-black text-3xl mb-8" style={{ textShadow: `3px 3px 0 ${C.mustard}` }}>HOW IT WORKS</h1>
          <div className="grid md:grid-cols-4 gap-5">
            {[
              [FileUp, "01", "UPLOAD", "Send your file in any format. We open STL, OBJ, 3MF, STEP & more."],
              [Cpu, "02", "QUOTE", "Pick precision & settings. We confirm exact price + turnaround on WhatsApp."],
              [Box, "03", "PRINT", "Approve & pay via UPI or card. We print on our Bambu A1."],
              [Truck, "04", "SHIP", "Packed safe & dispatched across India. Tracking shared."],
            ].map(([Icon, n, t, d], i) => (
              <Panel key={i} color={C.paper} className="p-5">
                <div className="font-mono font-black text-3xl mb-2" style={{ color: C.orange }}>{n}</div>
                <Icon size={28} color={C.teal} className="mb-3" />
                <div className="font-mono font-bold mb-1">{t}</div>
                <div className="font-mono text-xs" style={{ color: C.tealDk }}>{d}</div>
              </Panel>
            ))}
          </div>
          <Panel color={C.ink} className="p-6 mt-8">
            <div className="font-mono font-bold text-lg mb-3" style={{ color: C.mustard }}>WHY RETROFORGE?</div>
            <div className="grid sm:grid-cols-2 gap-3">
              {["No minimum order \u2014 print just one", "UPI & Credit Card accepted", "Four precision levels, down to 0.08mm", "PLA, PETG & TPU in-house", "Pan-India shipping", "Real human on WhatsApp, not a bot"].map((x, i) => (
                <div key={i} className="flex items-center gap-2 font-mono text-sm" style={{ color: C.cream }}><Check size={16} color={C.teal} /> {x}</div>
              ))}
            </div>
          </Panel>
        </div>
      )}

      <div style={{ background: C.ink, borderTop: `4px solid ${C.orange}` }}>
        <div className="max-w-6xl mx-auto px-4 py-10 grid md:grid-cols-3 gap-6">
          <div>
            <div className="font-mono font-bold text-lg mb-2" style={{ color: C.cream }}>RETRO<span style={{ color: C.mustard }}>FORGE</span><span style={{ color: C.teal }}>_3D</span></div>
            <p className="font-mono text-xs" style={{ color: C.paper }}>India's friendly print-on-demand bureau. Upload anything, we'll make it real.</p>
          </div>
          <div className="font-mono text-sm space-y-2" style={{ color: C.paper }}>
            <div className="flex items-center gap-2"><Phone size={14} color={C.mustard} /> {PHONE_DISPLAY}</div>
            <a href={`mailto:${EMAIL}`} className="flex items-center gap-2"><Mail size={14} color={C.mustard} /> {EMAIL}</a>
            <div className="flex items-center gap-2"><MapPin size={14} color={C.mustard} /> Gurugram, Haryana</div>
          </div>
          <div className="font-mono text-xs" style={{ color: C.paper }}>
            <div className="flex items-center gap-2 mb-1"><Smartphone size={13} color={C.teal} /> <CreditCard size={13} color={C.teal} /> UPI & Card accepted</div>
            <div>Mon\u2013Sat \u00B7 10:00\u201319:00 IST</div>
            <div>Prices include 18% GST</div>
            <div className="mt-3" style={{ color: C.tealDk }}>\u00A9 2026 RetroForge 3D. Built with melted plastic.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
